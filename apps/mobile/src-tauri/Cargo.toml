[package]
name = "dray-mobile"
version = "0.1.0"
description = "The Dray phone client"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "dray_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
